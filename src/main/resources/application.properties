spring.application.name=model-serving-gateway

# ---- 网关核心参数 ----
gateway.backend-timeout-ms=200
gateway.failure-threshold=3
gateway.open-state-ms=2000
gateway.cache-ttl-ms=60000

# ---- 内置内存推理后端 ----
gateway.backends[0].id=backend-a
gateway.backends[0].latency-ms=5
gateway.backends[0].failure=none
gateway.backends[1].id=backend-b
gateway.backends[1].latency-ms=5
gateway.backends[1].failure=none

# ---- 已注册模型版本与灰度权重 ----
gateway.versions[0].model=fraud
gateway.versions[0].version=v1
gateway.versions[0].backend=backend-a
gateway.versions[0].enabled=true
gateway.versions[0].weight=80
gateway.versions[1].model=fraud
gateway.versions[1].version=v2
gateway.versions[1].backend=backend-b
gateway.versions[1].enabled=true
gateway.versions[1].weight=20
