# ===== 模型版本注册表：version -> family / 期望特征维度 =====
gateway.versions.ml-score-v1.family=ml-score
gateway.versions.ml-score-v1.expected-feature-dim=3
gateway.versions.ml-score-v2.family=ml-score
gateway.versions.ml-score-v2.expected-feature-dim=4
gateway.versions.embed-v1.family=embed
gateway.versions.embed-v1.expected-feature-dim=2

# ===== 内存推理后端实例（模拟多推理后端与版本）=====
gateway.backends[0].id=cpu-v1-1
gateway.backends[0].type=CPU
gateway.backends[0].version=ml-score-v1
gateway.backends[1].id=cpu-v1-2
gateway.backends[1].type=CPU
gateway.backends[1].version=ml-score-v1
gateway.backends[2].id=gpu-v2-1
gateway.backends[2].type=GPU
gateway.backends[2].version=ml-score-v2
gateway.backends[3].id=edge-v2-1
gateway.backends[3].type=EDGE
gateway.backends[3].version=ml-score-v2
gateway.backends[4].id=cpu-embed-1
gateway.backends[4].type=CPU
gateway.backends[4].version=embed-v1

# ===== 灰度权重（0..100 相对比例，按版本线配置）=====
gateway.weights.ml-score.ml-score-v1=100
gateway.weights.ml-score.ml-score-v2=0
gateway.weights.embed.embed-v1=100

# ===== 自愈熔断策略 =====
# 连续失败阈值：达到后隔离（OPEN）
gateway.circuit.failure-threshold=3
# 首次隔离冷却时长（毫秒）：冷却到点后放一个试探请求
gateway.circuit.initial-cooldown-ms=5000
# 试探失败后冷却逐级加长的乘数（>=1）：5s -> 10s -> 20s ...
gateway.circuit.backoff-multiplier=2.0
# 冷却时长上限（毫秒），退避到此封顶
gateway.circuit.max-cooldown-ms=60000
# 每个后端状态时间线保留条数（写满覆盖最旧）
gateway.circuit.timeline-capacity=20

# ===== 评分缓存 TTL =====
gateway.cache.ttl-ms=60000
